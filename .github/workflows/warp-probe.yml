name: WARP probe (scratch)

on:
  push:
    branches: ['ci-probe/**']

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download the PR #82 Windows build (run 40054268633, e2 2f45a1e)
        uses: actions/download-artifact@v4
        with:
          name: pangaea-windows-dfa1d87bb1a1711cd8674a6a34e3e1c03bedc694
          path: builds/windows
          run-id: 40054268633
          github-token: ${{ github.token }}

      - name: Probes on Forward+ (D3D12)
        continue-on-error: true
        run: |
          source tools/bounded.sh
          mkdir -p logs
          probe() {
            local name="$1"; shift
            echo "=== $name"
            bounded 90 "$@" > "logs/$name.log" 2>&1 || echo "exit $?"
            grep -v 'Unreferenced static\|string_name.cpp' "logs/$name.log" | head -60
            echo "--- Godot log"
            grep -v 'Unreferenced static\|string_name.cpp' "logs/$name.txt" 2>/dev/null | head -60
          }
          EXE=builds/windows/Pangaea-dev.exe
          probe print $EXE --log-file "$(cygpath -m "$PWD/logs/print.txt")" --resolution 640x360 --script "$(cygpath -m "$PWD/ci-probe/print_probe.gd")"
          WEIGHT_FROM=100000 probe noweight $EXE --log-file "$(cygpath -m "$PWD/logs/noweight.txt")" --resolution 640x360 --script "$(cygpath -m "$PWD/ci-probe/blend_probe.gd")"
          WEIGHT_FROM=60 probe weight $EXE --log-file "$(cygpath -m "$PWD/logs/weight.txt")" --resolution 640x360 --script "$(cygpath -m "$PWD/ci-probe/blend_probe.gd")"
