name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # nightly.yml runs the whole of CI on main and publishes the build only when every job passes.
  workflow_call:

jobs:
  gdscript-lint:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Godot 4 GDScript Toolkit
        run: python -m pip install gdtoolkit==4.5.0

      - name: Lint game, tests and tools
        continue-on-error: true
        run: gdlint game tests tools

      - name: Check formatting without changing files
        if: always()
        continue-on-error: true
        run: gdformat --check game tests tools

      - name: Report missing paths in documentation
        if: always()
        run: python tools/check_docs.py --report

  test-and-export:
    runs-on: ubuntu-24.04
    # A backstop only: check.sh and check_release.sh stop each Godot run that hangs (the unit
    # suite after 15 minutes, every other run sooner) and fail with its output so far, well
    # inside this; the export step has its own limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain
        run: grep -E "^[A-Z_]+=" tools/toolchain.env >> "$GITHUB_ENV"

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            .toolchain
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-windows-templates

      - name: Install Godot
        run: tools/setup_toolchain.sh --templates

      - name: Import, test and smoke check
        run: tools/check.sh

      - name: Export Windows build
        timeout-minutes: 10
        run: tools/export_windows.sh

      - name: Start the exported release exe without the dev tools
        run: tools/check_release.sh ".toolchain/Godot_v${GODOT_RELEASE}_linux.x86_64" builds/windows/Pangaea.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: pangaea-windows-${{ github.sha }}
          path: builds/windows/
          retention-days: 30

  # Proves the uploaded build starts on Windows itself: the release exe headless (main scene and
  # the release probe) and the dev exe with a real renderer (the --perf-tour swim). See
  # tools/check_windows_launch.sh.
  windows-launch:
    needs: test-and-export
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download the Windows build
        uses: actions/download-artifact@v4
        with:
          name: pangaea-windows-${{ github.sha }}
          path: builds/windows

      - name: Launch the build on Windows
        run: tools/check_windows_launch.sh builds/windows

      - name: Upload the launch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launch-logs-${{ github.sha }}
          path: builds/windows-launch/
          retention-days: 14
