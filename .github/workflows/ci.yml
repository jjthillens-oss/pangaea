name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    # A backstop only: check.sh and check_release.sh stop each Godot run that hangs (the unit
    # suite after 15 minutes, every other run sooner) and fail with its output so far, well
    # inside this; the export step has its own limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain
        run: grep -E "^[A-Z_]+=" tools/toolchain.env >> "$GITHUB_ENV"

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            .toolchain
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-windows-templates

      - name: Install Godot
        run: tools/setup_toolchain.sh --templates

      - name: Import, test and smoke check
        run: tools/check.sh

      - name: Export Windows build
        timeout-minutes: 10
        run: tools/export_windows.sh

      - name: Start the exported release exe without the dev tools
        run: tools/check_release.sh ".toolchain/Godot_v${GODOT_RELEASE}_linux.x86_64" builds/windows/Pangaea.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: pangaea-windows-${{ github.sha }}
          path: builds/windows/
          retention-days: 30

  soak:
    # The soak tier (tools/check_soak.sh: test_soak_*, the long S1 gates), in parallel with
    # test-and-export. Its Godot run stops itself after 60 minutes (tools/bounded.sh) and fails
    # with its output so far; this timeout is the backstop. S1 sign-off needs it green.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain
        run: grep -E "^[A-Z_]+=" tools/toolchain.env >> "$GITHUB_ENV"

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: godot-${{ env.GODOT_RELEASE }}-linux

      - name: Install Godot
        run: tools/setup_toolchain.sh

      - name: Import and run the soak tests
        run: tools/check_soak.sh
