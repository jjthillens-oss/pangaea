name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    # A backstop only: check.sh and check_release.sh stop each Godot run that hangs (the unit
    # suite after 20 minutes, every other run sooner) and fail with its output so far, well
    # inside this; the export step has its own limit. 40 minutes holds the S1 fast and slow
    # budgets (S1 build plan B-13).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain
        run: grep -E "^[A-Z_]+=" tools/toolchain.env >> "$GITHUB_ENV"

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            .toolchain
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-windows-templates

      - name: Install Godot
        run: tools/setup_toolchain.sh --templates

      - name: Import, test and smoke check
        run: tools/check.sh

      - name: Export Windows build
        timeout-minutes: 10
        run: tools/export_windows.sh

      - name: Start the exported release exe without the dev tools
        run: tools/check_release.sh ".toolchain/Godot_v${GODOT_RELEASE}_linux.x86_64" builds/windows/Pangaea.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: pangaea-windows-${{ github.sha }}
          path: builds/windows/
          retention-days: 30

  # The soak tier (tools/check_soak.sh: test_soak_*, the long S1 gates) in two jobs, in parallel
  # with test-and-export and with each other (S1 build plan B-14): soak-a runs the endless gates and
  # cost cases, soak-b every other soak file, so a new one lands there without a list edit. Each
  # Godot soak run stops itself after 60 minutes (tools/bounded.sh) and fails with its output so
  # far; the job timeout is the backstop. S1 sign-off needs both green.
  soak-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain
        run: grep -E "^[A-Z_]+=" tools/toolchain.env >> "$GITHUB_ENV"

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: godot-${{ env.GODOT_RELEASE }}-linux

      - name: Install Godot
        run: tools/setup_toolchain.sh

      - name: Import and run the endless gates and cost cases
        run: tools/check_soak.sh --only=test_endless_gates,test_endless_cost

  soak-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain
        run: grep -E "^[A-Z_]+=" tools/toolchain.env >> "$GITHUB_ENV"

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: godot-${{ env.GODOT_RELEASE }}-linux

      - name: Install Godot
        run: tools/setup_toolchain.sh

      - name: Import and run every other soak test
        run: tools/check_soak.sh --skip=test_endless_gates,test_endless_cost
